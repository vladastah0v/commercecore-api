[project]
name = "commercecore-api"
version = "0.1.0"
description = "A modular backend API for an online store."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.0,<8.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
