name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check code style
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Start test services
        run: docker compose -p commercecore-ci -f docker-compose.test.yml up -d --wait
      - name: Apply migrations
        env:
          COMMERCECORE_POSTGRES_HOST: 127.0.0.1
          COMMERCECORE_POSTGRES_PORT: "55432"
          POSTGRES_USER: commercecore_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: commercecore_test
        run: uv run alembic upgrade head
      - name: Run tests and check coverage
        env:
          COMMERCECORE_RUN_INFRA_TESTS: "1"
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Stop test services
        if: always()
        run: docker compose -p commercecore-ci -f docker-compose.test.yml down --volumes

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t commercecore-api:ci .
