services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: commercecore_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: commercecore_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercecore_test -d commercecore_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
